<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Ikigai – Das Teamleiter-RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --holo:#7fe3ff; --holo2:#bff3ff; --gold:#f5c542; --bg:#050a18; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#eaf8ff;font-family:Rajdhani,system-ui,sans-serif;overflow:hidden}
  #app{height:100%;display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#06243a}
  #stage:fullscreen{width:100vw;height:100vh}
  #app:fullscreen{width:100vw;height:100vh;background:var(--bg)}
  #app:fullscreen #bar{padding:3px 8px;gap:6px;min-height:0;background:rgba(6,11,28,.92)}
  #app:fullscreen #bar .tb{font-size:11px;padding:3px 8px;opacity:.85}
  #app:fullscreen #bar .tb:hover{opacity:1}
  #app:fullscreen #bar .hint{display:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none!important}
  .orb{font-family:Orbitron,Rajdhani,sans-serif}

  /* ---------- Insel-Labels ---------- */
  .ilabel{position:absolute;transform:translate(-50%,-100%);text-align:center;pointer-events:none;transition:opacity .4s;white-space:nowrap}
  .ilabel b{display:block;font-family:Orbitron,sans-serif;font-size:1em;letter-spacing:.12em;padding:.35em .9em;
    background:rgba(6,20,40,.55);border:1px solid var(--c);color:#fff;box-shadow:0 0 12px var(--c),inset 0 0 10px rgba(255,255,255,.08);
    text-shadow:0 0 8px var(--c);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .ilabel span{display:block;font-size:1.1em;font-weight:600;margin-top:.25em;color:#d8f6ff;text-shadow:0 1px 3px #000}
  .ilabel.cleared b::after{content:"  ✓";color:var(--c)}

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:1.2em;top:1.1em;width:19em;pointer-events:none}
  .hud-top{display:flex;align-items:center;gap:.6em}
  .avatar{width:2.8em;height:2.8em;border-radius:50%;border:2px solid var(--holo);display:grid;place-items:center;font-family:Orbitron;font-weight:900;
    background:radial-gradient(circle at 35% 30%,#3a7bd5,#0b1a38);box-shadow:0 0 12px rgba(127,227,255,.6);font-size:1em}
  .hud-name{font-family:Orbitron;font-weight:700;font-size:1.15em;letter-spacing:.06em}
  .flag{height:.8em;width:1.2em;vertical-align:-.05em;margin-left:.15em;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
  #title .flag{height:.75em;width:1.125em}
  .hud-name small{color:var(--gold);margin-left:.5em;font-size:.75em}
  .bar{height:.55em;background:rgba(0,0,0,.45);border:1px solid rgba(127,227,255,.5);margin-top:.35em;position:relative;overflow:hidden;
    clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
  .bar i{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#38d46a,#b8ff7a)}
  .bar.xp i{background:linear-gradient(90deg,#f5c542,#ff5c8a,#34d399,#60a5fa);width:0;transition:width 1s cubic-bezier(.2,.9,.3,1)}
  .bar-l{display:flex;justify-content:space-between;font-size:.85em;font-weight:700;letter-spacing:.12em;color:#bfe9ff;margin-top:.45em}

  #quest{position:absolute;right:1.2em;top:1.1em;width:19em;padding:.7em .9em;pointer-events:none;
    background:linear-gradient(180deg,rgba(127,227,255,.12),rgba(10,30,60,.35));border:1px solid rgba(127,227,255,.45);
    box-shadow:0 0 14px rgba(127,227,255,.2);backdrop-filter:blur(4px)}
  #quest h4{margin:0 0 .45em;font-family:Orbitron;font-size:.8em;letter-spacing:.18em;color:var(--holo)}
  #quest .q{font-size:1.08em;font-weight:600;display:flex;gap:.5em;align-items:center;line-height:1.55;opacity:.75}
  #quest .q i{width:.6em;height:.6em;transform:rotate(45deg);border:1.5px solid var(--c);flex:none}
  #quest .q.done{opacity:.55;text-decoration:line-through}
  #quest .q.done i{background:var(--c)}
  #quest .q.now{opacity:1;color:#fff}
  #quest .q.now i{box-shadow:0 0 8px var(--c);animation:pulse 1s infinite alternate}
  @keyframes pulse{to{transform:rotate(45deg) scale(1.35)}}

  /* ---------- Hologramm-Fenster ---------- */
  .holo{position:absolute;width:29em;pointer-events:none;z-index:5}
  .holo-in{position:relative;padding:1em 1.2em 1.1em;
    background:linear-gradient(160deg,rgba(90,170,220,.42),rgba(14,44,86,.78) 45%,rgba(6,20,44,.86));
    border:1px solid rgba(160,235,255,.85);backdrop-filter:blur(8px) saturate(1.2);
    box-shadow:0 0 22px rgba(90,210,255,.45),inset 0 0 28px rgba(140,230,255,.15);
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
  .holo-in::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
  .holo.open .holo-in{animation:holoOpen .55s cubic-bezier(.2,.9,.25,1) both}
  @keyframes holoOpen{0%{transform:scale(.25,.015);opacity:0;filter:brightness(3)}35%{transform:scale(1,.015);opacity:1;filter:brightness(3)}100%{transform:none;filter:none}}
  .h-head{font-family:Orbitron;font-weight:900;font-size:1.2em;letter-spacing:.14em;color:#fff;text-shadow:0 0 10px var(--c),0 0 2px var(--c)}
  .h-head .br{color:var(--c)}
  .h-sub{font-size:1.1em;font-weight:600;letter-spacing:.08em;color:#cfefff;margin:.25em 0 .7em;padding-bottom:.55em;border-bottom:1px solid rgba(160,235,255,.35)}
  .h-sub b{color:var(--c)}
  .hrow{display:flex;gap:.75em;align-items:center;padding:.5em .55em;margin-top:.45em;
    background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.02));border-left:3px solid var(--c);
    animation:rowIn .5s cubic-bezier(.2,1.2,.3,1) both}
  @keyframes rowIn{0%{opacity:0;transform:translateX(-24px);filter:brightness(3)}60%{opacity:1;filter:brightness(1.6)}100%{transform:none;filter:none}}
  .hico{width:3.3em;height:3.3em;flex:none;border-radius:50%;box-shadow:0 0 12px var(--c)}
  .hico img{width:100%;height:100%;display:block}
  .hrow.old{animation:none;opacity:.78}
  .hrow.new{border-left-width:5px;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.03))}
  .ht{font-weight:700;font-size:1.45em;color:#fff;letter-spacing:.02em;line-height:1.15}
  .ht .hn{font-family:Orbitron;font-size:.62em;color:var(--c);margin-right:.45em;letter-spacing:.1em}
  .hd{font-size:1.2em;font-weight:500;color:#d6f1ff;line-height:1.25}
  .h-text{font-size:1.3em;font-weight:600;line-height:1.35;color:#eefaff}
  .h-prof{display:grid;grid-template-columns:auto 1fr;gap:.15em .9em;font-size:1.2em;margin-bottom:.6em}
  .h-pwrap{display:flex;gap:1.1em;align-items:center}
  .h-av{width:7.6em;height:7.6em;flex:none;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 16px var(--c),inset 0 0 0 3px rgba(255,255,255,.15)}
  .avatar img{width:100%;height:100%;border-radius:50%;display:block}
  .avatar{overflow:hidden;padding:0}
  .h-prof dt{font-family:Orbitron;font-size:.62em;letter-spacing:.14em;color:var(--c);align-self:center}
  .h-prof dd{margin:0;font-weight:700}
  .h-foot{margin-top:.7em;font-family:Orbitron;font-size:.7em;letter-spacing:.2em;color:rgba(200,240,255,.7);text-align:right;animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}

  /* ---------- Banner / Toast ---------- */
  #banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;z-index:6}
  #banner.show{animation:banner 2.6s ease both}
  @keyframes banner{0%{opacity:0;transform:scaleX(1.6)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
  #banner .b1{font-family:Orbitron;font-size:.85em;letter-spacing:.5em;color:#fff}
  #banner .b2{font-family:Orbitron;font-weight:900;font-size:2.4em;letter-spacing:.1em;color:#fff;text-shadow:0 0 18px var(--c),0 0 4px var(--c)}
  #banner .line{height:2px;width:46%;margin:.5em auto;background:linear-gradient(90deg,transparent,var(--c),transparent)}
  #toast{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-family:Orbitron;font-size:.9em;letter-spacing:.2em;
    padding:.6em 1.2em;background:rgba(6,20,40,.6);border:1px solid var(--c,#7fe3ff);box-shadow:0 0 12px var(--c,#7fe3ff);opacity:0;transition:opacity .3s;pointer-events:none;z-index:6;white-space:nowrap}
  #toast.show{opacity:1}

  /* ---------- Overlays ---------- */
  .overlay{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
  #title{background:radial-gradient(ellipse at 50% 45%,rgba(10,40,80,.55),rgba(3,6,16,.92))}
  #title .sys{font-family:Orbitron;font-size:.75em;letter-spacing:.6em;color:var(--holo);margin-bottom:1em}
  #title h1{font-family:Orbitron;font-weight:900;font-size:4em;letter-spacing:.12em;margin:0;color:#fff;
    text-shadow:0 0 24px rgba(127,227,255,.8),0 0 4px #fff}
  #title .tag{margin:.8em 0 .3em;font-size:1.4em;font-weight:700}
  #title .tag span{color:var(--gold)}
  #title .role{color:#9fc6dd;font-weight:600;margin-bottom:2.2em}
  .hbtn{font-family:Orbitron;font-weight:700;letter-spacing:.2em;font-size:.85em;color:#fff;cursor:pointer;padding:1em 2em;
    background:linear-gradient(180deg,rgba(127,227,255,.25),rgba(127,227,255,.08));border:1px solid var(--holo);
    box-shadow:0 0 16px rgba(127,227,255,.45);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:.15s}
  .hbtn:hover{background:rgba(127,227,255,.35);box-shadow:0 0 26px rgba(127,227,255,.8)}
  .hbtn.ghost{border-color:rgba(255,255,255,.5);box-shadow:none;background:transparent}
  .row{display:flex;gap:1em;justify-content:center;flex-wrap:wrap}
  .keys{margin-top:2em;color:#9fc6dd;font-size:.95em;line-height:2}
  kbd{font-family:Orbitron;font-size:.7em;border:1px solid rgba(127,227,255,.6);padding:.2em .5em;color:#fff;background:rgba(127,227,255,.1)}

  #finale{justify-content:flex-end;padding-bottom:2.5%;pointer-events:none}
  #finale .fin{pointer-events:auto}
  #stage.cine #hud,#stage.cine #quest,#stage.cine #labels{opacity:0;transition:opacity 1s}
  #hud,#quest,#labels{transition:opacity 1s}
  .fin{display:flex;align-items:center;gap:3em;width:min(92%,62em);padding:1.3em 2.2em;text-align:left;position:relative;
    background:linear-gradient(160deg,rgba(220,248,255,.16),rgba(60,140,210,.08) 45%,rgba(10,30,70,.4));
    border:1px solid rgba(160,235,255,.85);box-shadow:0 0 30px rgba(90,210,255,.45),inset 0 0 40px rgba(140,230,255,.12);
    clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);animation:holoOpen .7s cubic-bezier(.2,.9,.25,1) both}
  .fin svg{display:none}
  .fin svg circle.v{transform-box:fill-box;transform-origin:center;animation:grow .8s cubic-bezier(.2,1.3,.4,1) both}
  .fin svg circle.v:nth-of-type(2){animation-delay:.15s}.fin svg circle.v:nth-of-type(3){animation-delay:.3s}.fin svg circle.v:nth-of-type(4){animation-delay:.45s}
  .fin svg .fade{animation:fade .6s ease both;animation-delay:1s}
  @keyframes grow{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .fin .k{font-family:Orbitron;font-weight:900;letter-spacing:.16em;font-size:1.05em;color:#fff;text-shadow:0 0 12px var(--gold)}
  .fin .k span{color:var(--gold)}
  .fin .ik{font-size:1.6em;font-weight:700;line-height:1.25;margin:.5em 0 .5em;padding-left:.7em;border-left:3px solid var(--gold);animation:fade .8s ease both;animation-delay:1.2s}
  .fin .ex{font-size:1.35em;font-weight:600;color:#cfefff;animation:fade .8s ease both;animation-delay:1.5s}
  .fin .ex b{font-family:Orbitron;font-size:.7em;letter-spacing:.14em;color:var(--holo);display:block;margin-bottom:.2em}
  .fin .ty{font-family:Orbitron;font-weight:900;font-size:1.1em;letter-spacing:.2em;margin:.5em 0 .7em;animation:fade .8s ease both;animation-delay:1.8s}

  /* ---------- Leiste ---------- */
  #bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#060b1c;border-top:1px solid #12305a;flex-wrap:wrap;justify-content:center}
  #bar .tb{font-family:Rajdhani;font-weight:700;font-size:16px;letter-spacing:.04em;background:#0d1d3a;color:#dff6ff;border:1px solid #1f4b80;padding:7px 12px;cursor:pointer}
  #bar .tb:hover{background:#163063}
  #bar .tb.primary{background:#7fe3ff;color:#04101f;border-color:#7fe3ff}
  #bar .hint{color:#6f8fb0;font-size:13px;font-weight:600}

  /* ---------- Editor ---------- */
  #editor{position:fixed;inset:0;background:rgba(3,6,16,.86);z-index:30;overflow:auto;padding:28px 12px;display:flex;justify-content:center}
  .ed{background:#fff;color:#141a2e;width:min(860px,100%);border-radius:10px;padding:24px 26px 0;height:max-content;font-family:system-ui,sans-serif}
  .ed h2{margin:0 0 4px}
  .ed .hint{color:#5b6180;font-size:14px;margin:0 0 14px}
  .ed fieldset{border:1px solid #dde1ef;border-radius:8px;margin:0 0 14px;padding:10px 14px 8px}
  .ed legend{font-weight:800;padding:0 6px}
  .ed label{display:block;font-size:11px;font-weight:800;color:#5b6180;margin:6px 0 3px;text-transform:uppercase;letter-spacing:.05em}
  .ed select,.ed input[type=text],.ed input[type=number],.ed textarea{width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid #cfd4e6;border-radius:6px}
  .ed textarea{min-height:46px;resize:vertical}
  .ed .g3{display:grid;grid-template-columns:11em 1fr 2fr;gap:0 10px}
  .ed .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .ed .colors{display:flex;gap:20px;margin:10px 0 4px}
  .ed .colors label{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:#141a2e}
  .ed details{margin:0 0 14px;font-size:14px}
  .ed details textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:12px}
  .ed .actions{position:sticky;bottom:0;background:#fff;display:flex;gap:10px;justify-content:flex-end;padding:12px 0 16px;border-top:1px solid #eee;flex-wrap:wrap}
  .ed button{font:inherit;font-weight:700;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid #cfd4e6;background:#f3f5fb;cursor:pointer}
  .ed button.save{background:#0b1a38;color:#fff;border-color:#0b1a38}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="labels"></div>

    <div id="hud">
      <div class="hud-top">
        <div class="avatar" id="hudAv">M</div>
        <div style="flex:1">
          <div class="hud-name" id="hudName"></div>
          <div class="bar"><i></i></div>
        </div>
      </div>
      <div class="bar-l"><span>IKIGAI EXP</span><span id="xpTxt">0 / 4</span></div>
      <div class="bar xp"><i id="xpFill"></i></div>
    </div>
    <div id="quest"><h4>◆ QUEST · FINDE MEIN IKIGAI</h4><div id="qList"></div></div>

    <div id="holo" class="holo hidden"><div class="holo-in" id="holoIn">
      <div class="h-head" id="hHead"></div>
      <div class="h-sub" id="hSub"></div>
      <div id="hBody"></div>
      <div class="h-foot" id="hFoot">▸ WEITER</div>
    </div></div>

    <div id="banner"><div class="b1" id="b1"></div><div class="line"></div><div class="b2" id="b2"></div><div class="line"></div></div>
    <div id="toast"></div>

    <div id="title" class="overlay">
      <div class="sys">◆ IKIGAI WORLD · SYSTEM ONLINE ◆</div>
      <h1>MY IKIGAI</h1>
      <div class="tag" id="tTag"></div>
      <div class="role" id="tRole"></div>
      <div class="row">
        <button class="hbtn" id="startBtn">▶ SYSTEM START</button>
        <button class="hbtn ghost" id="editBtn2">✎ INHALTE</button>
      </div>
      <div class="keys">
        <kbd>N</kbd> / <kbd>Bild ↓</kbd> / Presenter: nächster Schritt &nbsp;·&nbsp; <kbd>Bild ↑</kbd> zurück<br>
        <kbd>←↑↓→</kbd> / <kbd>WASD</kbd> selbst laufen &nbsp;·&nbsp; <kbd>F</kbd> Vollbild &nbsp;·&nbsp; <kbd>R</kbd> Neustart
      </div>
    </div>

    <div id="finale" class="overlay hidden">
      <div class="fin">
        <svg id="venn" viewBox="0 0 400 400"></svg>
        <div style="flex:1;min-width:0">
          <div class="k"><span>[</span> IKIGAI UNLOCKED <span>]</span></div>
          <div class="ik" id="finIk"></div>
          
          
          <div class="row" style="justify-content:flex-start">
            <button class="hbtn ghost" id="backBtn">◂ KARTE</button>
            <button class="hbtn ghost" id="restart2">↺ NEU</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="bar">
    <button class="tb primary" id="nextBtn">▶ Nächster Schritt (N)</button>
    <button class="tb" id="prevBtn">◂ Zurück</button>
    <button class="tb" id="restartBtn">↺ Neustart</button>
    <button class="tb" id="fsBtn">⛶ Präsentieren (Vollbild)</button>
    <button class="tb" id="muteBtn">🔊 Ton</button>
    <button class="tb" id="ikBtn" style="background:#f5c542;color:#1a1205;border-color:#f5c542">✦ Ikigai Finale</button>
    <button class="tb" id="editBtn">✎ Inhalte bearbeiten</button>
    <span class="hint">Presenter: Bild ↓ / Bild ↑</span>
  </div>
</div>
<div id="editor" class="hidden"></div>

<script>
/* ===================== INHALTE ===================== */
const KEY='ikigai-rpg-v18';
const COLORS=['#f5c542','#ff5c8a','#34d399','#60a5fa'];
const DEFAULT={
  name:'My', level:21, role:'SOKO', origin:'Vietnam', pet:'Igel',
  intro:'Hallo zusammen! Ich bin eure neue Teamleitung. Statt Folien nehme ich euch heute mit in meine Welt: vier Inseln – ein Ziel. Mein Ikigai.',
  hair:'#2a1a12', outfit:'#3a7bd5',
  islands:[
    {name:'Skill Island', circle:'Was ich gut kann', header:'SKILLSET UNLOCKED', items:[
      {s:'compass',t:'Concept',d:'Strategie, Bauen & visuelle Planung'},
      {s:'mic',t:'Stage Presence',d:'Präsentation, Bühne & Begeisterung'}]},
    {name:'Passion Island', circle:'Was ich liebe', header:'PASSION UNLOCKED', items:[
      {s:'target',t:'Ziele = Motivation',d:'Höher zielen, um mehr zu erreichen.'},
      {s:'gem',t:'Einzigartigkeit',d:'Be crazy, be special, be yourself.'}]},
    {name:'Trust Island', circle:'Was ich meinem Team gebe', header:'TRUST MODE ACTIVATED', items:[
      {s:'radar',t:'Igelmodus',d:'Beobachtungmodus, bevor ich mich richtig öffnen kann.'},
      {s:'guard',t:'Schutzschild',d:'Nach außen die Verantwortung übernehmen. Intern lösen wir das zusammen.'}]},
    {name:'Value Island', circle:'Was ich von meinem Team erwarte', header:'CORE VALUES UNLOCKED', items:[
      {s:'truesight',t:'Direktheit und Ehrlichkeit',d:'Damit wir uns besser ergänzen, müssen wir die tatsächlichen Fähigkeiten und Bedürfnisse der anderen verstehen.'},
      {s:'rose',t:'Gleichheit und Respekt',d:'„Everyone needs to be valued. Everyone has the potential to give something back.“ Quote von Diana, Princess of Wales'}]}
  ],
  boss:'Herr Dr. Schütz', bossTitle:'Guild Master',
  girls:'Alina, Ramza',
  boys:'Alan, Yevhen, Hieu, Neel, Cedric, Thore, Finn, Lennart',
  teamHeader:'PARTY QUEST', teamTitle:'Was ich von euch erwarte',
  expectations:[
    {s:'chat',t:'Offenheit',d:'Platzhalter – sagt mir ehrlich, was läuft und was nicht'},
    {s:'key',t:'Eigenverantwortung',d:'Platzhalter'},
    {s:'people',t:'Miteinander',d:'Platzhalter'}],
  ikigai:'Und das war ich. Und das war meine Ikigai-Welt. Ich freue mich auf unsere zukünftige Zusammenarbeit!'
};
const clone=o=>JSON.parse(JSON.stringify(o));
const validCfg=c=>c&&Array.isArray(c.islands)&&c.islands.length===4&&Array.isArray(c.expectations);
function loadCfg(){try{const raw=localStorage.getItem(KEY);if(raw){const c=JSON.parse(raw);if(validCfg(c))return Object.assign(clone(DEFAULT),c);}}catch(e){}return clone(DEFAULT);}

  if(sym==='heli'){S.fx.heli=T;S.fxEnd.heli=0;}
  if(sym==='guard'){if(!S.fx.guard){S.fx.guard=T;S.fx.guardP=stPos(i,j);}side=P.x>240?1:-1;}
  openPanel({kind:'station',i,j,sym,c:COLORS[i],side,head:`${isl.header||'UNLOCKED'}`,
    sub:`<b>${esc(isl.name)}</b> · ${esc(isl.circle)} &nbsp;<span style="float:right;font-family:Orbitron;font-size:.8em;color:var(--c)">${got}/${n}</span>`,items:[],rev:0,
    body:its.map((it,k)=>S.unl[i][k]?`<div class="hrow ${k===j?'new':'old'}">${rowHTML(it,k+1,COLORS[i])}</div>`:'').join('')});
  pop();hud();
}
function introPanel(){
  openPanel({kind:'intro',c:'#7fe3ff',side:1,head:'MY PROFILE',sub:'<b>NEW PARTY LEADER</b> · Willkommen',items:[],rev:0,
    body:`<div class="h-pwrap"><img class="h-av" alt="" src="${avatarURL()}"><dl class="h-prof"><dt>NAME</dt><dd>${esc(CFG.name)}</dd><dt>ABTEILUNG</dt><dd>${esc(CFG.role)}</dd><dt>ALTER</dt><dd>${esc(CFG.level)}</dd><dt>HERKUNFT</dt><dd>${esc(CFG.origin||'Vietnam')} ${CFG.flag!==false?FLAG_SVG:''}</dd><dt>LIEBLINGSTIER</dt><dd>${esc(CFG.pet||'Igel')} 🦔</dd></dl></div>`});
}
function teamPanel(){
  openPanel({kind:'team',c:'#c9a7ff',side:1,head:CFG.teamHeader||'PARTY QUEST',sub:`<b>${esc(CFG.teamTitle)}</b>`,items:filled(CFG.expectations),rev:0});
}

/* ===================== ABLAUF ===================== */
function start(){
  if(S.phase!=='title')return;
  S.phase='play';$('title').classList.add('hidden');ac();
  setTimeout(introPanel,700);
}
function pathTo(tx,ty,ti){
  const cur=regionOf(P.x,P.y),pts=[];
  if(cur===ti&&cur!==-2)return[{x:tx,y:ty}];
  if(cur>=0)pts.push(entry(cur));
  pts.push({x:CEN.x,y:CEN.y});
  if(ti>=0)pts.push(entry(ti));
  pts.push({x:tx,y:ty});return pts;
}
function goNext(){
  const i=S.cleared.indexOf(false);
  if(i>=0){const j=S.unl[i].indexOf(false);if(j<0||j>=nItems(i)){S.cleared[i]=true;hud();return goNext();}const t=stStand(i,j);auto=pathTo(t.x,t.y,i);return;}
  if(!S.teamDone){if(Math.hypot(P.x-TEAM_SPOT.x,P.y-TEAM_SPOT.y)<6){S.teamDone=true;startParty();return;}S.inTeam=false;auto=pathTo(TEAM_SPOT.x,TEAM_SPOT.y,-1);return;}
  openFinale();
}
const HIST=[];
function snap(){HIST.push({S:JSON.parse(JSON.stringify(S)),P:{...P},pan:panel?{kind:panel.kind,i:panel.i,j:panel.j}:null});if(HIST.length>300)HIST.shift();}
function presenterNext(){
  if(editorOpen)return;
  if(S.phase==='final')return;
  if(!(auto&&auto.length&&!panel))snap();
  if(S.phase==='title'){start();return;}
  if(panel){if(panel.rev<panel.items.length){reveal();return;}const k=panel.kind;closePanel();if(k==='team')return;goNext();return;}
  if(auto&&auto.length){const l=auto[auto.length-1];P.x=l.x;P.y=l.y;auto=null;return;}
  goNext();
}
function presenterPrev(){
  if(editorOpen||!HIST.length)return;
  const h=HIST.pop();
  clearTimeout(ikTimer);$('finale').classList.add('hidden');stage.classList.remove('cine');
  holo.classList.add('hidden');panel=null;auto=null;parts=[];
  S=h.S;P={...h.P,moving:false};PET.x=P.x+8;PET.y=P.y+3;
  $('title').classList.toggle('hidden',S.phase!=='title');
  if(h.pan){if(h.pan.kind==='station')stationPanel(h.pan.i,h.pan.j);else if(h.pan.kind==='intro')introPanel();}
  hud();
}
function manualAdvance(){
  if(S.phase==='title'){start();return;}
  if(!panel)return;
  if(panel.rev<panel.items.length)reveal();else closePanel();
}
function mixHex(a,b,t){const A=hexRgb(a),B=hexRgb(b);return'#'+A.map((v,k)=>Math.round(v+(B[k]-v)*t).toString(16).padStart(2,'0')).join('');}
function myCloth(){const base=CFG.outfit||'#3a7bd5';if(!S.party)return base;return mixHex(base,TEAM_JACKET,Math.max(0,Math.min(1,(T-S.party-.4)/1)));}
function startParty(){
  S.party=T;auto=null;P.dir='down';
  banner('PARTY JOINED','WELCOME TO THE TEAM','#f5c542');
  fanfare();setTimeout(()=>[1046,1318,1568,2093].forEach((f,k)=>tone(f,.4,.05,'triangle',k*.12)),600);
  for(let k=0;k<60;k++){const a=Math.random()*6.28,sp=15+Math.random()*30;parts.push({x:P.x,y:P.y-9,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.6-14,life:1.2+Math.random(),c:TEAM_JACKET,s:.8+Math.random()});}
  hud();
}
function confetti(dt){
  if(!S.party)return;
  const cols=['#f5c542','#ff5c8a','#34d399','#60a5fa','#ffffff','#c9a7ff'];
  if(Math.random()<dt*40)parts.push({x:180+Math.random()*120,y:110,vx:(Math.random()-.5)*8,vy:10+Math.random()*12,life:3,c:cols[Math.random()*cols.length|0],s:.9+Math.random()*.8});
}
let ikTimer=null;
function openFinale(){
  if(S.ik)return;
  S.phase='final';panel=null;holo.classList.add('hidden');auto=null;S.ik=T;
  stage.classList.add('cine');
  $('finIk').textContent=CFG.ikigai;
  tone(196,1.6,.05,'sine');setTimeout(()=>[523,659,784,1046].forEach((f,k)=>tone(f,.5,.05,'triangle',k*.18)),1100);
  setTimeout(()=>{if(S.ik){fanfare();tone(2093,1,.05,'sine',.4);}},2800);
  clearTimeout(ikTimer);ikTimer=setTimeout(()=>{if(S.ik)$('finale').classList.remove('hidden');},4300);
}
function closeFinale(){clearTimeout(ikTimer);$('finale').classList.add('hidden');S.phase='play';S.ik=null;stage.classList.remove('cine');}
function restart(){HIST.length=0;clearTimeout(ikTimer);stage.classList.remove('cine');reset();cam={x:240,y:165,z:1};holo.classList.add('hidden');$('finale').classList.add('hidden');$('title').classList.remove('hidden');hud();}

const keys={};
function setDir(dx,dy){P.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');}
function updatePet(dt){
  const dx=P.x-PET.x,dy=P.y+2-PET.y,d=Math.hypot(dx,dy),keep=10;
  if(d>keep){const sp=Math.min(d-keep,(auto?100:80)*dt*(d>30?2.2:1.15));PET.x+=dx/d*sp;PET.y+=dy/d*sp;PET.mv=Math.min(1,PET.mv+dt*6);if(Math.abs(dx)>.5)PET.flip=dx>0;}
  else PET.mv=Math.max(0,PET.mv-dt*4);
  if(d>120){PET.x=P.x+8;PET.y=P.y+3;}
}
function roseIdx(){const it=islandItems(3);return it.findIndex(x=>x&&x.s==='rose');}
function princess(){
  const j=roseIdx();if(j<0)return;
  const st=stPos(3,j),x=st.x-sideOf(3)*11,y=st.y+2;
  const b=Math.sin(T*1.6)*.25;
  E(x,y,6,1.8);F('rgba(0,0,0,.28)');
  // Kleid
  ctx.beginPath();ctx.moveTo(x-2.4,y-10);ctx.lineTo(x+2.4,y-10);ctx.quadraticCurveTo(x+3,y-5,x+5.4,y-.4);ctx.quadraticCurveTo(x,y+.9,x-5.4,y-.4);ctx.quadraticCurveTo(x-3,y-5,x-2.4,y-10);ctx.closePath();
  ctx.fillStyle=lg(ctx,x-5,0,x+5,0,['#f9c5d8','#f472b6','#db2777']);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=.25;[-2.6,0,2.6].forEach(o=>{ctx.beginPath();ctx.moveTo(x+o*.3,y-8);ctx.quadraticCurveTo(x+o*.7,y-4,x+o,y-.2);ctx.stroke();});
  ctx.fillStyle='#fde68a';ctx.fillRect(x-2.5,y-8.4,5,.6);
  // Kopf
  const hy=y-13.6+b, HC='#7a4a2b', HL='#9a6340';
  // lange Haare hinten (wellig)
  ctx.beginPath();ctx.moveTo(x-4.3,hy-2);
  ctx.bezierCurveTo(x-5.6,hy+2,x-4.8,hy+4.6,x-5.2,hy+7);
  ctx.quadraticCurveTo(x-4.2,hy+8,x-3.3,hy+7.1);ctx.lineTo(x-2.6,hy+4);ctx.lineTo(x+2.6,hy+4);ctx.lineTo(x+3.3,hy+7.1);ctx.quadraticCurveTo(x+4.2,hy+8,x+5.2,hy+7);
  ctx.bezierCurveTo(x+4.8,hy+4.6,x+5.6,hy+2,x+4.3,hy-2);ctx.closePath();ctx.fillStyle=HC;ctx.fill();
  // Gesicht
  E(x,hy,4.2,4.1);F('#f6d2b8');
  // Haarkappe + Pony mit Seitenscheitel
  ctx.beginPath();ctx.ellipse(x,hy-.8,4.6,3.9,0,Math.PI*1.02,Math.PI*1.98);
  ctx.quadraticCurveTo(x+3.4,hy+.2,x+1.2,hy-1);ctx.quadraticCurveTo(x-.4,hy-.2,x-1.8,hy-1.2);ctx.quadraticCurveTo(x-3.6,hy-.2,x-4.5,hy+.4);ctx.closePath();
  ctx.fillStyle=HC;ctx.fill();
  // Seitensträhnen vorne
  ctx.beginPath();ctx.moveTo(x-4.4,hy-.6);ctx.quadraticCurveTo(x-4.9,hy+3.5,x-3.6,hy+6.4);ctx.lineTo(x-3.2,hy+2.2);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(x+4.4,hy-.6);ctx.quadraticCurveTo(x+4.9,hy+3.5,x+3.6,hy+6.4);ctx.lineTo(x+3.2,hy+2.2);ctx.closePath();ctx.fill();
  // Glanz
  ctx.strokeStyle=HL;ctx.lineWidth=.45;ctx.beginPath();ctx.arc(x-.8,hy-1.6,2.6,3.5,4.5);ctx.stroke();
  E(x-1.6,hy+1.3,.62,.95);F('#2a2238');E(x+1.6,hy+1.3,.62,.95);F('#2a2238');E(x-1.8,hy+.9,.25,.25);F('#fff');E(x+1.4,hy+.9,.25,.25);F('#fff');
  E(x-2.5,hy+2.4,.75,.38);F('rgba(255,120,140,.45)');E(x+2.5,hy+2.4,.75,.38);F('rgba(255,120,140,.45)');
  ctx.strokeStyle='#b0606a';ctx.lineWidth=.25;ctx.beginPath();ctx.arc(x,hy+2.6,.55,.3,Math.PI-.3);ctx.stroke();
  // Arme + Rose in der Hand
  ctx.fillStyle='#f9a8d4';ctx.fillRect(x-3.6,y-9.6,1.2,3.6);ctx.fillRect(x+2.4,y-9.6,1.2,3.6);
  E(x-3,y-5.7,.8,.8);F('#f6d2b8');E(x+3,y-5.7,.8,.8);F('#f6d2b8');
  ctx.strokeStyle='#2f7d3b';ctx.lineWidth=.35;ctx.beginPath();ctx.moveTo(x+3,y-5.4);ctx.lineTo(x+3.6,y-8.4);ctx.stroke();E(x+3.7,y-8.9,.9,.8);F('#ffffff');E(x+3.7,y-8.9,.45,.4);F('#fbcfe8');
  // Krone
  const ty=hy-4.6;ctx.beginPath();ctx.moveTo(x-2.6,ty+1.4);ctx.lineTo(x-2.6,ty-.4);ctx.lineTo(x-1.3,ty+.6);ctx.lineTo(x,ty-1.2);ctx.lineTo(x+1.3,ty+.6);ctx.lineTo(x+2.6,ty-.4);ctx.lineTo(x+2.6,ty+1.4);ctx.closePath();
  ctx.fillStyle=lg(ctx,x,ty-1.2,x,ty+1.4,['#fff7cc','#f5c542','#b7791f']);ctx.fill();
  E(x,ty+.5,.35,.35);F('#60a5fa');E(x-1.6,ty+.8,.25,.25);F('#f472b6');E(x+1.6,ty+.8,.25,.25);F('#f472b6');
  ctx.save();ctx.globalCompositeOperation='lighter';const a=Math.max(0,Math.sin(T*2.5));ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.moveTo(x+.2,ty-2.6);ctx.lineTo(x+.5,ty-1.6);ctx.lineTo(x+.2,ty-.6);ctx.lineTo(x-.1,ty-1.6);ctx.closePath();ctx.fill();ctx.restore();
}
function drawPet(){
  const hop=S.party?Math.abs(Math.sin(T*8))*2.2:PET.mv*Math.abs(Math.sin(T*16))*.7;
  E(PET.x,PET.y,3.6-hop*.25,1.2);F('rgba(0,0,0,.28)');
  hedgehog(PET.x,PET.y-2.9-hop,.72,PET.flip);
}
function update(dt){
  updatePet(dt);
  T+=dt;P.moving=false;
  if(S.phase!=='play'||editorOpen)return;
  const mv=(keys.right?1:0)-(keys.left?1:0), mvy=(keys.down?1:0)-(keys.up?1:0);
  if(panel){ if((mv||mvy)&&panel.rev>=panel.items.length)closePanel(); return; }
  if(auto&&auto.length){
    const p=auto[0],dx=p.x-P.x,dy=p.y-P.y,d=Math.hypot(dx,dy),sp=95*dt;
    if(d<=sp){P.x=p.x;P.y=p.y;auto.shift();if(!auto.length)auto=null;}else{P.x+=dx/d*sp;P.y+=dy/d*sp;}
    if(d>.01)setDir(dx,dy);P.moving=true;
  }else if(mv||mvy){
    const l=Math.hypot(mv,mvy),sp=70*dt,vx=mv/l,vy=mvy/l;
    const nx=P.x+vx*sp;if(walkable(nx,P.y))P.x=nx;const ny=P.y+vy*sp;if(walkable(P.x,ny))P.y=ny;
    setDir(vx,vy);P.moving=true;
  }
  // Trigger
  const r=regionOf(P.x,P.y);
  if(r!==-2&&r!==S.region){if(r>=0&&!S.cleared[r])toast('ENTERING · '+CFG.islands[r].name.toUpperCase(),COLORS[r]);S.region=r;}
  for(let i=0;i<4;i++)for(let j=0;j<nItems(i);j++)if(!S.unl[i][j]){const t=stStand(i,j);if(Math.hypot(P.x-t.x,P.y-t.y)<4.5){P.dir=sideOf(i)>0?'left':'right';stationPanel(i,j);return;}}
  const inT=Math.hypot(P.x-TEAM_SPOT.x,P.y-TEAM_SPOT.y)<6;
  if(inT&&!S.inTeam){if(allClear()&&!S.teamDone){P.dir='down';S.teamDone=true;startParty();}else if(!allClear())toast(`ERST ALLE INSELN ERKUNDEN · ${S.cleared.filter(Boolean).length}/4`,'#c9a7ff');}
  S.inTeam=inT;
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(stage.clientWidth!==CW||stage.clientHeight!==CH)resize();
  update(dt);render(dt);requestAnimationFrame(loop);
}

/* ===================== EDITOR ===================== */
function openEditor(){
  editorOpen=true;for(const k in keys)keys[k]=false;
  const inp=(p,v,cls)=>`<input type="text" data-p="${p}" value="${esc(v)}"${cls?` class="${cls}"`:''}>`;
  const ta=(p,v)=>`<textarea data-p="${p}">${esc(v)}</textarea>`;
  const items=(base,arr,n)=>{let h='';for(let j=0;j<n;j++){const it=arr[j]||{s:'star',t:'',d:''};
    const sel=`<select data-p="${base}.${j}.s">${Object.entries(SYM_LABELS).map(([k,l])=>`<option value="${k}"${k===(it.s||'star')?' selected':''}>${l}</option>`).join('')}</select>`;
    h+=`<div class="g3"><div><label>Symbol</label>${sel}</div><div><label>Punkt ${j+1}</label>${inp(`${base}.${j}.t`,it.t)}</div><div><label>Beschreibung</label>${inp(`${base}.${j}.d`,it.d)}</div></div>`;}return h;};
  let h=`<div class="ed"><h2>Inhalte bearbeiten</h2><p class="hint">Leere Punkte werden ausgelassen. Gespeichert wird nur in diesem Browser – bearbeite am besten auf dem Rechner, auf dem du präsentierst (oder nutze „Sichern“ unten).</p>
  <fieldset><legend>Dein Charakter</legend>
    <div class="g2"><div><label>Name</label>${inp('name',CFG.name)}</div><div><label>Level</label>${inp('level',CFG.level)}</div></div>
    <label>Abteilung</label>${inp('role',CFG.role)}
    <label>Herkunft</label>${inp('origin',CFG.origin||'Vietnam')}
    <label>Begrüßung (Player Profile)</label>${ta('intro',CFG.intro)}
    <div class="colors"><label>Haare <input type="color" data-p="hair" value="${esc(CFG.hair)}"></label><label>Outfit <input type="color" data-p="outfit" value="${esc(CFG.outfit)}"></label></div>
  </fieldset>`;
  CFG.islands.forEach((isl,i)=>{h+=`<fieldset style="border-left:5px solid ${COLORS[i]}"><legend>Insel ${i+1}</legend>
    <div class="g2"><div><label>Inselname</label>${inp(`islands.${i}.name`,isl.name)}</div><div><label>Ikigai-Bereich</label>${inp(`islands.${i}.circle`,isl.circle)}</div></div>
    <label>Hologramm-Überschrift</label>${inp(`islands.${i}.header`,isl.header)}${items(`islands.${i}.items`,isl.items,3)}</fieldset>`;});
  h+=`<fieldset style="border-left:5px solid #c9a7ff"><legend>Team in der Mitte</legend>
    <div class="g2"><div><label>Chef (Name)</label>${inp('boss',CFG.boss||'')}</div><div><label>Chef-Titel</label>${inp('bossTitle',CFG.bossTitle||'')}</div></div>
    <label>Mädchen neben dir (Komma-getrennt)</label>${inp('girls',CFG.girls||'')}
    <label>Jungs (Komma-getrennt, max. 10)</label>${inp('boys',CFG.boys||'')}
    <div class="g2"><div><label>Hologramm-Überschrift</label>${inp('teamHeader',CFG.teamHeader)}</div><div><label>Untertitel</label>${inp('teamTitle',CFG.teamTitle)}</div></div>
    ${items('expectations',CFG.expectations,4)}</fieldset>
  <fieldset style="border-left:5px solid #f5c542"><legend>Finale</legend><label>Dein Ikigai-Satz</label>${ta('ikigai',CFG.ikigai)}</fieldset>
  <details><summary>Inhalte sichern / übertragen</summary><textarea id="edJson">${esc(JSON.stringify(CFG,null,2))}</textarea>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button id="edCopy">Kopieren</button><button id="edImp">Text übernehmen</button><span id="edMsg" style="color:#5b6180"></span></div></details>
  <div class="actions"><button id="edReset">Platzhalter wiederherstellen</button><button id="edCancel">Abbrechen</button><button class="save" id="edSave">Speichern & neu starten</button></div></div>`;
  const ed=$('editor');ed.innerHTML=h;ed.classList.remove('hidden');ed.scrollTop=0;
  $('edCancel').onclick=closeEditor;
  $('edReset').onclick=()=>{CFG=clone(DEFAULT);saveCfg();closeEditor();buildTeam();buildStatic();restart();};
  $('edSave').onclick=()=>{
    const c=clone(CFG);
    ed.querySelectorAll('[data-p]').forEach(el=>{const ps=el.dataset.p.split('.');let o=c;
      for(let k=0;k<ps.length-1;k++){if(o[ps[k]]==null)o[ps[k]]=/^\d+$/.test(ps[k+1])?[]:{};o=o[ps[k]];}
      o[ps[ps.length-1]]=el.value;});
    c.islands.forEach(isl=>isl.items=isl.items.map(x=>x||{s:'star',t:'',d:''}));c.expectations=c.expectations.map(x=>x||{s:'star',t:'',d:''});
    CFG=c;saveCfg();closeEditor();buildTeam();buildStatic();restart();
  };
  $('edCopy').onclick=()=>{const t=$('edJson');t.select();try{navigator.clipboard.writeText(t.value).then(()=>$('edMsg').textContent='Kopiert ✓',()=>$('edMsg').textContent='Mit Strg+C kopieren');}catch(e){$('edMsg').textContent='Mit Strg+C kopieren';}};
  $('edImp').onclick=()=>{try{const c=JSON.parse($('edJson').value);if(!validCfg(c))throw 0;CFG=c;saveCfg();closeEditor();buildTeam();buildStatic();restart();}catch(e){$('edMsg').textContent='Text konnte nicht gelesen werden.';}};
}
function closeEditor(){editorOpen=false;$('editor').classList.add('hidden');}

/* ===================== EINGABE ===================== */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
function fullscreen(){try{if(!document.fullscreenElement)document.getElementById('app').requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{});}catch(e){}}
addEventListener('keydown',e=>{
  if(editorOpen)return;
  if(KM[e.code]){keys[KM[e.code]]=true;auto=null;e.preventDefault();return;}
  switch(e.code){
    case 'KeyN':case 'PageDown':case 'Period':e.preventDefault();presenterNext();break;
    case 'PageUp':case 'KeyB':e.preventDefault();presenterPrev();break;
    case 'Space':case 'Enter':e.preventDefault();manualAdvance();break;
    case 'KeyF':fullscreen();break;
    case 'KeyI':if(S.phase==='play'){snap();openFinale();}break;
    case 'KeyR':restart();break;
    case 'Escape':if(S.phase==='final')closeFinale();break;
  }
});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=false;});
const blurThen=fn=>e=>{e.currentTarget.blur();fn();};
$('startBtn').onclick=start;
$('nextBtn').onclick=blurThen(presenterNext);
$('prevBtn').onclick=blurThen(presenterPrev);
$('restartBtn').onclick=blurThen(restart);
$('restart2').onclick=restart;
$('backBtn').onclick=closeFinale;
$('fsBtn').onclick=blurThen(fullscreen);
$('muteBtn').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇 Ton aus':'🔊 Ton';e.currentTarget.blur();};
$('ikBtn').onclick=e=>{e.currentTarget.blur();if(S.phase==='final')return;snap();if(S.phase==='title')start();openFinale();};$('editBtn').onclick=openEditor;$('editBtn2').onclick=openEditor;
stage.addEventListener('click',e=>{if(S.phase==='play'&&e.target===cv)presenterNext();});

document.addEventListener('fullscreenchange',()=>{$('fsBtn').textContent=document.fullscreenElement?'⛶ Vollbild beenden':'⛶ Präsentieren (Vollbild)';});
reset();resize();buildTeam();buildStatic();requestAnimationFrame(loop);
</script>
